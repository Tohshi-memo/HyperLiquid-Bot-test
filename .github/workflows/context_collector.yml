name: Public Crypto Context Collector

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      COLLECTOR_PROFILE: 'context'
      RSS_FEEDS: 'https://cointelegraph.com/rss,https://www.coindesk.com/arc/outboundfeeds/rss/'
      MACRO_RSS_FEEDS: 'https://feeds.bbci.co.uk/news/business/rss.xml,https://feeds.bbci.co.uk/news/world/rss.xml,https://www.cnbc.com/id/20910258/device/rss/rss.html,https://www.cnbc.com/id/20409666/device/rss/rss.html,https://finance.yahoo.com/news/rssindex'
      POLICY_RSS_FEEDS: 'https://www.federalreserve.gov/feeds/press_all.xml,https://www.federalreserve.gov/feeds/speeches.xml'
      COMMODITY_RSS_FEEDS: 'https://www.cnbc.com/id/19836768/device/rss/rss.html'
      RSS_ITEMS_PER_FEED: '30'
      CONTEXT_LOOKBACK_HOURS: '12'
      GDELT_QUERIES: 'bitcoin OR ethereum OR crypto OR stablecoin,federal reserve OR inflation OR treasury yields OR oil OR gold OR stocks'
      MACRO_INDICATORS_ENABLED: 'false'
      MACRO_INDICATORS_HISTORY_MAX_RECORDS: '8640'
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      POLYMARKET_QUERIES: 'crypto,bitcoin,ethereum,hyperliquid,oil,gold,federal reserve,interest rates,stock market,war,military,conflict,israel,iran,ukraine,russia,china,taiwan,election,tariffs,pandemic,covid,covid-19,virus,disease,outbreak,bird flu,avian flu,h5n1,hantavirus,world health organization,who declare pandemic,public health'
      POLYMARKET_FILTER_MODE: 'watch'
      POLYMARKET_MARKET_LIMIT: '80'
      POLYMARKET_DISCOVERY_LIMIT: '500'
      POLYMARKET_TAG_IDS: '131'
      POLYMARKET_EVENT_SLUGS: 'democratic-presidential-nominee-2028,republican-presidential-nominee-2028,presidential-election-winner-2028'
      POLYMARKET_KEEP_EVENT_MARKETS: 'true'
      POLYMARKET_OUTCOME_HISTORY_MAX_RECORDS: '75000'
      POLYMARKET_OUTCOME_HISTORY_MAX_BYTES: '85000000'
      HISTORY_MAX_RECORDS: '8640'
      ASSET_UNIVERSE_ENABLED: 'true'
      ASSET_UNIVERSE_MAX_RECORDS: '2880'
      ASSET_UNIVERSE_ACTIVE_RECORDS: '672'
      ASSET_UNIVERSE_ARCHIVE_ENABLED: 'true'
      ASSET_UNIVERSE_TOP_LIMIT: '25'
      ASSET_UNIVERSE_CLASS_TOP_LIMIT: '10'
      ASSET_UNIVERSE_HIP3_DEXS: 'all'
      HIP4_OUTCOME_ENABLED: 'true'
      HIP4_INFO_URL: 'https://api.hyperliquid.xyz/info'
      HIP4_HISTORY_MAX_RECORDS: '720'
      HIP4_HISTORY_MAX_BYTES: '80000000'
      HIP4_TOP_LIMIT: '25'
      HIP4_BUCKET_MINUTES: '15'
      DAY_SWING_ENABLED: 'true'
      DAY_SWING_SYMBOLS: 'BTC,ETH,HYPE,SOL'
      DAY_SWING_INTERVALS: '15m,1h,4h'
      DAY_SWING_LABEL_HORIZONS: '1h,4h,24h,72h'
      DAY_SWING_MAX_RECORDS: '12000'
      RELATIONSHIP_SYMBOL_LIMIT: '1000'
      RELATIONSHIP_TOP_LIMIT: '2000'
      RELATIONSHIP_ALLOWED_CLASSES: 'equity,commodity,metal,index,fx,crypto_major,crypto_alt,unknown'
      SECTOR_REACTIONS_ENABLED: 'true'
      SECTOR_REACTION_REFRESH_HOURS: '12'
      SECTOR_PRICE_HISTORY_MAX_RECORDS: '6500'
      SECTOR_REACTION_MAX_ROWS: '5000'
      SECTOR_REACTION_MIN_SAMPLES: '20'
      SECTOR_REACTION_TOP_LIMIT: '50'
      AI_INDEX_ENABLED: 'true'
      CANARY_MIN_SAMPLES: '24'
      CANARY_TOP_LIMIT: '10'
      LOG_LEVEL: 'INFO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect public context
        run: python -m collector.collect_context

      - name: Build report site data
        run: python tools/build_report_site_data.py

      - name: Commit context data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add --force \
            data/processed/market_context.json \
            data/processed/market_context_history.json \
            data/processed/polymarket_outcome_history.json \
            data/processed/polymarket_outcome_latest.json \
            data/processed/asset_universe_latest.json \
            data/processed/asset_price_history.json \
            data/processed/asset_features_latest.json \
            data/processed/asset_features_all.json \
            data/processed/hip4_outcome_latest.json \
            data/processed/hip4_outcome_history.json \
            data/processed/day_swing_dataset.json \
            data/processed/relationship_scan_latest.json \
            data/processed/sector_reactions_latest.json \
            data/processed/sector_price_history.json \
            data/processed/ai_context_index.json \
            data/processed/canary_signals.json \
            data/processed/ai_analysis_pack.json \
            data/reports/latest_context.md \
            data/reports/latest_asset_universe.md \
            data/reports/latest_asset_features.md \
            data/reports/latest_hip4_outcome.md \
            data/reports/latest_day_swing.md \
            data/reports/latest_relationship_scan.md \
            data/reports/latest_sector_reactions.md \
            data/reports/latest_ai_context_index.md \
            data/reports/latest_canary_signals.md \
            data/reports/latest_ai_analysis_brief.md \
            docs/data/processed/market_context.json \
            docs/data/processed/polymarket_outcome_latest.json \
            docs/data/processed/asset_features_latest.json \
            docs/data/processed/asset_features_all.json \
            docs/data/processed/hip4_outcome_latest.json \
            docs/data/processed/relationship_scan_latest.json \
            docs/data/processed/sector_reactions_latest.json \
            docs/data/processed/sector_price_history.json \
            docs/data/processed/ai_context_index.json \
            docs/data/processed/canary_signals.json \
            docs/data/processed/ai_analysis_pack.json \
            docs/data/reports/latest_context.md \
            docs/data/reports/latest_asset_universe.md \
            docs/data/reports/latest_asset_features.md \
            docs/data/reports/latest_hip4_outcome.md \
            docs/data/reports/latest_day_swing.md \
            docs/data/reports/latest_relationship_scan.md \
            docs/data/reports/latest_sector_reactions.md \
            docs/data/reports/latest_ai_context_index.md \
            docs/data/reports/latest_canary_signals.md \
            docs/data/reports/latest_ai_analysis_brief.md \
            2>/dev/null || true
          git restore --worktree data/archive/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update public context [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Context push failed (attempt ${attempt}/5). Retrying..."
            sleep $((attempt * 5))
          done

          echo "Failed to save context data after retries."
          exit 1
