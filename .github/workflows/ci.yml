name: Collector CI

on:
  push:
    branches:
      - main
    paths:
      - 'collector/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'collector/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python -m compileall collector

      - run: python -m unittest discover -s tests -v
