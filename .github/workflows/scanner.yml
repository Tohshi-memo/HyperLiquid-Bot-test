name: HyperLiquid Momentum Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN mode'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: hyperliquid-momentum-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      HYPERLIQUID_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_PRIVATE_KEY }}
      HYPERLIQUID_ACCOUNT_ADDRESS: ${{ secrets.HYPERLIQUID_ACCOUNT_ADDRESS }}
      HYPERLIQUID_VAULT_ADDRESS: ${{ secrets.HYPERLIQUID_VAULT_ADDRESS }}
      HYPERLIQUID_TESTNET: ${{ vars.HYPERLIQUID_TESTNET || 'false' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RUN_ONCE: 'true'
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      BTC_BEARISH_THRESHOLD: '-0.5'
      BTC_STAGNANT_THRESHOLD: '0.2'
      ALT_SURGE_THRESHOLD: '5.0'
      RELATIVE_STRENGTH_THRESHOLD: '5.0'
      MIN_24H_VOLUME_USDT: '1000000'
      MAX_OHLCV_CHECKS: '50'
      RSI_PERIOD: '14'
      RSI_OVERBOUGHT: '70'
      BB_PERIOD: '20'
      BB_STD: '2.0'
      ANALYSIS_TIMEFRAME: '1h'
      OHLCV_LIMIT: '100'
      RSI_4H_MAX: '65'
      USE_4H_FILTER: 'true'
      ATR_PERIOD: '14'
      USE_ATR_SL: 'true'
      ATR_SL_MULT: '1.5'
      ATR_SL_MIN: '1.0'
      ATR_SL_MAX: '4.0'
      RISK_REWARD_RATIO: '2.0'
      COOLDOWN_HOURS: '48'
      CIRCUIT_BREAKER_WINDOW: '10'
      CIRCUIT_BREAKER_LOSSES: '5'
      CIRCUIT_BREAKER_LOOKBACK_HOURS: '48'
      STOP_LOSS_PCT: '2.0'
      TAKE_PROFIT_PCT: '4.0'
      TRACKING_HOURS: '24'
      EXPERIMENT_TRACKING_HOURS: '8'
      EXPERIMENT_MAX_PER_CYCLE: '20'
      EXPERIMENT_HOT_MAX: '500'
      MARKET_CONTEXT_ENABLED: 'true'
      MARKET_CONTEXT_MAX_RECORDS: '288'
      MARKET_CONTEXT_TOP_SYMBOLS: '20'
      MARKET_CONTEXT_NEAR_MISS_LIMIT: '30'
      MARKET_CONTEXT_ANALYSIS_SYMBOL_LIMIT: '25'
      LIVE_MIN_EV_PCT: '0.20'
      LIVE_MIN_RANKER_FILLED: '10'
      LIVE_SHORT_ONLY: 'true'
      LIVE_MIN_BALANCE_USDT: '5.0'
      LIVE_MAX_OPEN_POSITIONS: '3'
      LOG_LEVEL: 'INFO'
      LOG_FILE: 'logs/scanner.log'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python main.py

      - name: Save scanner data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/ --force 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update scanner data [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Data push failed (attempt ${attempt}/3). Retrying..."
            sleep 5
          done

          echo "Failed to save scanner data after retries."
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
