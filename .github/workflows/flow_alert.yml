name: Public Flow Alert Collector

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-flow-alert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      COLLECTOR_PROFILE: 'flow_alert'
      POLYMARKET_QUERY: 'crypto'
      POLYMARKET_MARKET_LIMIT: '60'
      FLOW_ALERT_LOOKBACK_HOURS: '24'
      FLOW_ALERT_HISTORY_MAX_RECORDS: '2016'
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      DUNE_LARGE_FLOW_QUERY_ID: ${{ vars.DUNE_LARGE_FLOW_QUERY_ID }}
      DUNE_RESULT_LIMIT: '100'
      LOG_LEVEL: 'INFO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect public flow alert
        run: python -m collector.collect_context

      - name: Commit flow alert data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/processed/ data/reports/ data/archive/.gitkeep --force 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update public flow alert [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Flow alert push failed (attempt ${attempt}/3). Retrying..."
            sleep 5
          done

          echo "Failed to save flow alert data after retries."
          exit 1
