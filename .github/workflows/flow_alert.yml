name: Public Flow Alert Collector

on:
  schedule:
    - cron: '0-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      COLLECTOR_PROFILE: 'flow_alert'
      POLYMARKET_QUERIES: 'crypto,bitcoin,ethereum,hyperliquid,oil,gold,war,military,conflict,israel,iran,ukraine,russia,china,taiwan,pandemic,outbreak,bird flu,avian flu,h5n1,hantavirus,who declare pandemic'
      POLYMARKET_FILTER_MODE: 'watch'
      POLYMARKET_MARKET_LIMIT: '60'
      POLYMARKET_DISCOVERY_LIMIT: '250'
      FLOW_ALERT_LOOKBACK_HOURS: '24'
      FLOW_ALERT_HISTORY_MAX_RECORDS: '8640'
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      DUNE_LARGE_FLOW_QUERY_ID: ${{ vars.DUNE_LARGE_FLOW_QUERY_ID }}
      DUNE_RESULT_LIMIT: '100'
      LOG_LEVEL: 'INFO'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect public flow alert
        run: python -m collector.collect_context

      - name: Build report site data
        run: python tools/build_report_site_data.py

      - name: Dual-write incremental flow data
        env:
          TD_BASE_URL: ${{ secrets.TD_BASE_URL || vars.TD_BASE_URL }}
          TD_REPO: 'hyperliquid-bot-test'
          TD_HMAC_SECRET: ${{ secrets.TD_HMAC_SECRET }}
          TD_SYNC_LOOKBACK_MINUTES: '15'
        run: |
          if [ -z "$TD_BASE_URL" ] || [ -z "$TD_HMAC_SECRET" ]; then
            echo "::notice::Sakura dual-write is not configured; keeping Git-only collection."
            exit 0
          fi
          python tools/sync_storage_gateway.py --profile flow_alert

      - name: Preserve raw inputs after a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow-raw-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit flow alert data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add --force \
            data/processed/flow_alert.json \
            data/processed/flow_alert_history.json \
            data/processed/trading_data_sync_state.json \
            data/reports/latest_flow_alert.md \
            docs/data/processed/flow_alert.json \
            docs/data/reports/latest_flow_alert.md \
            2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update public flow alert [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Flow alert push failed (attempt ${attempt}/5). Retrying..."
            sleep $((attempt * 5))
          done

          echo "Failed to save flow alert data after retries."
          exit 1
